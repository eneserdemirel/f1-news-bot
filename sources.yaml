# ---------------- AYARLAR ----------------
settings:
  model: claude-haiku-5-5   # özet ve puanlama için kullanılan model
  min_score: 3              # 1-10 arası; 3 = F1 dışı ve dolgu içerik hariç tüm haberler
  trend_min_score: 5        # yükselen haberlerde (🔥) gönderim için yeterli puan
  max_posts_per_run: 15     # bir çalışmada en fazla kaç haber gönderilsin
  triage_effort: low        # puanlama için modelin çaba seviyesi (low = ucuz ve hızlı)
  max_age_hours: 6          # bundan eski haberler gönderilmez
  trend_window_min: 45      # "yükselen haber" için bakılan süre (dakika)
  trend_min_sources: 4      # bu sürede bu kadar farklı kaynak yazarsa 🔥 alarmı
  normal_interval_min: 10   # normal günlerde kontrol aralığı (dakika)
  race_interval_min: 5      # yarış haftasonunda kontrol aralığı (dakika)
  race_weekend: auto        # auto = takvime göre, on = hep açık, off = hep kapalı

# ---------------- KAYNAKLAR ----------------
# Sıra önemli: aynı haber birden fazla sitede çıkarsa listede ÜSTTEKİ kaynak seçilir.
# handle = paylaşımın altındaki "📰 @..." satırı. "# doğrula" yazanları X'te kontrol et.
# feeds boşsa veya çalışmazsa bot sitenin RSS'ini kendisi bulmaya çalışır,
# bulamazsa Google News yedeğini kullanır.
# lang = haberin dili (en, it, de, es, nl). discover: false = site genel spor sitesiyse
# otomatik RSS bulmayı kapatır, tüm sporlar gelmesin diye.
sources:
  # ---------- Resmi kaynaklar ----------
  - name: Formula 1
    handle: "@F1"
    site: https://www.formula1.com/en/latest
    feeds: [https://www.formula1.com/en/latest/all.xml]

  - name: FIA
    handle: "@fia"
    site: https://www.fia.com/news
    discover: false
    gnews_query: 'site:fia.com/news "Formula 1"'
    feeds: []

  # ---------- Haber siteleri ----------
  - name: Sky Sports F1
    handle: "@SkySportsF1"
    site: https://www.skysports.com/f1
    feeds: [https://www.skysports.com/rss/12433]

  - name: The Race
    handle: "@wearetherace"        # doğrula
    site: https://www.the-race.com
    feeds: [https://www.the-race.com/feed/]

  - name: Autosport
    handle: "@autosport"
    site: https://www.autosport.com/f1/
    feeds: [https://www.autosport.com/rss/f1/news/]

  - name: Motorsport.com Italia
    handle: "@msportitalia"        # doğrula
    site: https://it.motorsport.com/f1/
    feeds: [https://it.motorsport.com/rss/f1/news/]

  - name: RacingNews365
    handle: "@RacingNews365"
    site: https://racingnews365.com
    feeds: [https://racingnews365.com/feed/news.xml]

  - name: RacingNews365 NL
    handle: "@RacingNews365NL"     # doğrula
    site: https://racingnews365.nl
    feeds: [https://racingnews365.nl/feed/news.xml]

  - name: Motorsport Week
    handle: "@MotorsportWeek"
    site: https://www.motorsportweek.com
    feeds: [https://www.motorsportweek.com/feed/]

  - name: PlanetF1
    handle: "@Planet_F1"           # doğrula
    site: https://www.planetf1.com
    feeds: [https://www.planetf1.com/feed]

  - name: GPblog
    handle: "@GPblog"              # doğrula
    site: https://www.gpblog.com/en
    feeds: []

  - name: GPFans
    handle: "@GPFans_Global"       # doğrula
    site: https://www.gpfans.com/en/
    feeds: []

  # ---------- Haberi ilk veren yabancı kaynaklar ----------
  - name: Corriere dello Sport
    handle: "@CorSport"            # doğrula
    site: https://www.corrieredellosport.it/formula-1
    lang: it
    discover: false
    gnews_query: 'site:corrieredellosport.it "Formula 1"'
    feeds: [https://www.corrieredellosport.it/rss/formula-1]

  - name: Gazzetta dello Sport
    handle: "@Gazzetta_it"         # doğrula
    site: https://www.gazzetta.it/Formula-1/
    lang: it
    discover: false
    gnews_query: 'site:gazzetta.it/Formula-1'
    feeds: []                      # sitenin F1 RSS'i eski haberler veriyor, Google News kullanılıyor

  - name: Motorsport-Total
    handle: "@MST_com"             # doğrula
    site: https://www.motorsport-total.com/formel-1/
    lang: de
    gnews_query: 'site:motorsport-total.com/formel-1'
    feeds: []

  - name: Auto Motor und Sport
    handle: "@ams_formel1"         # doğrula
    site: https://www.auto-motor-und-sport.de/formel-1/
    lang: de
    discover: false
    gnews_query: 'site:auto-motor-und-sport.de/formel-1'
    feeds: []

  - name: AS
    handle: "@diarioas"            # doğrula
    site: https://as.com/motor/formula_1/
    lang: es
    discover: false
    gnews_query: 'site:as.com "Fórmula 1"'
    feeds: [https://feeds.as.com/mrss-s/pages/as/site/as.com/section/motor/subsection/formula_1/]
