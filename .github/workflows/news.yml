name: F1 News Bot

# GitHub'ın zamanlayıcısı sık aralıklarda güvenilir değil (10 dk yerine 30-50 dk'da bir tetikliyordu).
# Bu yüzden bot tek bir iş içinde ~5,5 saat boyunca döngüde çalışır ve her turda sources.yaml'daki
# aralığa göre bekler (normalde 10 dk, yarış haftasonunda 5 dk). Zamanlayıcı sadece döngü bitince
# yenisini başlatmak için var: aynı anda tek döngü çalışır, yenisi sırada bekler.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:          # elle çalıştırma
    inputs:
      mode:
        description: "run = normal (döngü), test = kaynak testi + örnek özet"
        type: choice
        options: [run, test]
        default: run

permissions:
  contents: write

concurrency:
  group: f1-news-bot-${{ github.event.inputs.mode == 'test' && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kaynak testi
        if: github.event.inputs.mode == 'test'
        run: python bot.py --mode test

      - name: Botu döngüde çalıştır
        if: github.event.inputs.mode != 'test'
        run: |
          git config user.name "f1-news-bot"
          git config user.email "f1-news-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 320 * 60 ))
          while true; do
            start=$(date +%s)
            git pull --rebase --quiet || { git rebase --abort 2>/dev/null; echo "git pull başarısız"; }
            python bot.py --mode run || echo "Bot bu turda hata verdi, sonraki turda tekrar denenecek"
            git add state/
            if ! git diff --cached --quiet; then
              git commit --quiet -m "Update seen state"
              { git pull --rebase --quiet && git push --quiet; } || { git rebase --abort 2>/dev/null; echo "Kayıt gönderilemedi, sonraki turda tekrar denenecek"; }
            fi
            interval=$(python3 gate.py || echo 10)
            next=$(( start + interval * 60 ))
            if [ "$next" -ge "$end" ]; then break; fi
            wait=$(( next - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then
              echo "Sonraki kontrol $interval dk aralıkla, $wait sn sonra"
              sleep "$wait"
            fi
          done
