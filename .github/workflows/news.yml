name: F1 News Bot

on:
  schedule:
    - cron: "*/20 * * * *"   # her 20 dakikada bir
  workflow_dispatch:          # elle çalıştırma
    inputs:
      mode:
        description: "run = normal, test = kaynak testi + örnek özet"
        type: choice
        options: [run, test]
        default: run

permissions:
  contents: write

concurrency:
  group: f1-news-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py --mode "${{ github.event.inputs.mode || 'run' }}"

      - name: Görülen haberleri kaydet
        if: always()
        run: |
          git config user.name "f1-news-bot"
          git config user.email "f1-news-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen state"
          git pull --rebase
          git push
